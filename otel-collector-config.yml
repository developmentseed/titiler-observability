receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    send_batch_size: 100
    timeout: 10s
  
  resource:
    attributes:
      - key: service.name
        value: titiler
        action: upsert
      - key: service.version
        from_attribute: service.version
        action: upsert

  attributes:
    actions:
      - key: trace_id
        from_context: trace_id
        action: upsert
      - key: span_id
        from_context: span_id
        action: upsert

  transform:
    log_statements:
      - context: log
        statements:
          - set(body, ParseJSON(body)) where IsString(body)
          - set(attributes["message"], body["message"]) where IsMap(body)

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write 

  loki:
    endpoint: http://loki:3100/loki/api/v1/push 

  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp] 
      processors: [resource, batch] 
      exporters: [otlp/jaeger, debug] 

    metrics:
      receivers: [otlp] 
      processors: [resource, batch] 
      exporters: [prometheusremotewrite, debug] 

    logs:
      receivers: [otlp] 
      processors: [resource, attributes, batch] 
      exporters: [loki, debug] 
